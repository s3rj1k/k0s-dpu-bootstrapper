apiVersion: v1
kind: ServiceAccount
metadata:
  name: k0s-dpu-bootstrapper
  namespace: dpf-operator-system
---
# Cross namespace is not supported, so every grant below is scoped to the one namespace the
# controller runs in and nothing here is cluster wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k0s-dpu-bootstrapper
  namespace: dpf-operator-system
rules:
  # DPF provisioning objects are read, never written.
  - apiGroups:
      - provisioning.dpu.nvidia.com
    resources:
      - dpus
      - dpuclusters
    verbs:
      - get
      - list
      - watch
  # Join script templates, read by label from this one namespace.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
  # The controller reads Secret contents live and by name, and only consumes metadata from
  # the informer. RBAC cannot say that, so list and watch do grant a namespace wide read.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k0s-dpu-bootstrapper
  namespace: dpf-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k0s-dpu-bootstrapper
subjects:
  - kind: ServiceAccount
    name: k0s-dpu-bootstrapper
    namespace: dpf-operator-system
---
# Leader election only needs a Lease in the controller's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k0s-dpu-bootstrapper-leader-election
  namespace: dpf-operator-system
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k0s-dpu-bootstrapper-leader-election
  namespace: dpf-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k0s-dpu-bootstrapper-leader-election
subjects:
  - kind: ServiceAccount
    name: k0s-dpu-bootstrapper
    namespace: dpf-operator-system
