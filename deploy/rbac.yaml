apiVersion: v1
kind: ServiceAccount
metadata:
  name: k0s-dpu-bootstrapper
  namespace: dpf-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k0s-dpu-bootstrapper
rules:
  # DPF provisioning objects are read, never written.
  - apiGroups:
      - provisioning.dpu.nvidia.com
    resources:
      - dpus
      - dpuclusters
    verbs:
      - get
      - list
      - watch
  # Join script templates, and the DPUCluster kubeconfig Secrets used to reach a DPU
  # cluster, plus the join Secret this controller renders.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
  # Secrets are read live and by name only, never listed or watched, so enumerating every
  # Secret in the cluster is not granted.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k0s-dpu-bootstrapper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k0s-dpu-bootstrapper
subjects:
  - kind: ServiceAccount
    name: k0s-dpu-bootstrapper
    namespace: dpf-operator-system
---
# Leader election only needs a Lease in the controller's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k0s-dpu-bootstrapper-leader-election
  namespace: dpf-operator-system
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k0s-dpu-bootstrapper-leader-election
  namespace: dpf-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k0s-dpu-bootstrapper-leader-election
subjects:
  - kind: ServiceAccount
    name: k0s-dpu-bootstrapper
    namespace: dpf-operator-system
